<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art of the Popsicle — Design & Digital Craft</title>
<meta name="description" content="Art of the Popsicle LLC — Product Strategy, Systems & Software, Identity & Interface.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#F2495C;
    --yellow:#FFC72C;
    --green:#7CB518;
    --wood:#D9A876;
    --ink:#1C1C1C;
    --ink-soft:#5B5B5B;
    --white:#FFFFFF;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    background:var(--white);
    overflow:hidden;
  }

  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    width:100vw;
  }

  .page{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:clamp(10px, 2vh, 22px);
    padding:4vh 6vw;
    width:100%;
    max-width:760px;
  }

  .logo{
    width:clamp(48px, 7vh, 76px);
    height:auto;
    display:block;
    transform-origin:50% 88%;
  }

  @media (prefers-reduced-motion: no-preference){
    .logo{
      animation:nod 9s ease-in-out infinite;
    }
  }
  @keyframes nod{
    0%, 92%, 100%{ transform:rotate(0deg); }
    93.5%{ transform:rotate(-6deg); }
    95%{ transform:rotate(4deg); }
    96.5%{ transform:rotate(-2deg); }
    98%{ transform:rotate(0deg); }
  }

  .logo-wrap{
    position:relative;
    display:inline-block;
    line-height:0;
  }

  .name{
    font-family:'Zilla Slab', serif;
    font-weight:600;
    font-size:clamp(28px, 4.6vh, 46px);
    letter-spacing:0.01em;
    color:var(--ink);
    line-height:1.05;
  }

  .tagline{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:clamp(12px, 1.6vh, 15px);
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .stripe{
    display:flex;
    height:4px;
    width:clamp(90px, 12vh, 130px);
    border-radius:2px;
    overflow:hidden;
    margin:clamp(2px, 0.6vh, 8px) 0;
  }
  .stripe span{ flex:1; }
  .stripe span:nth-child(1){ background:var(--coral); }
  .stripe span:nth-child(2){ background:var(--yellow); }
  .stripe span:nth-child(3){ background:var(--green); }

  .services{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(14px, 2.6vw, 32px);
    flex-wrap:wrap;
    margin-top:clamp(4px, 1vh, 10px);
  }

  .service{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:clamp(12px, 1.7vh, 15px);
    letter-spacing:0.02em;
    color:var(--ink);
    white-space:nowrap;
  }

  .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
    flex:none;
  }

  .contact{
    margin-top:clamp(10px, 2.4vh, 26px);
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:clamp(13px, 1.8vh, 16px);
    color:var(--ink-soft);
    text-decoration:none;
    letter-spacing:0.01em;
    border-bottom:1px solid transparent;
    transition:color 0.15s ease, border-color 0.15s ease;
  }

  .contact:hover,
  .contact:focus-visible{
    color:var(--ink);
    border-bottom-color:var(--wood);
  }

  .contact:focus-visible{
    outline:2px solid var(--green);
    outline-offset:4px;
    border-radius:2px;
  }

  @media (prefers-reduced-motion: no-preference){
    .page{
      animation:rise 0.6s ease both;
    }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .drip{
    position:fixed;
    top:0;
    left:0;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
    pointer-events:none;
    opacity:0;
    transform:translate(-50%, -50%);
    will-change:transform, opacity;
    z-index:5;
  }

  @media (max-width: 420px){
    .services{
      flex-direction:column;
      gap:8px;
    }
    .dot{ display:none; }
  }

  .sparkle-burst{
    position:fixed;
    top:0;
    left:0;
    width:0;
    height:0;
    pointer-events:none;
    z-index:6;
  }

  .sparkle-burst .glow{
    position:absolute;
    top:0;
    left:0;
    width:40px;
    height:40px;
    margin:-20px 0 0 -20px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,199,44,0.55) 45%, rgba(255,255,255,0) 72%);
    animation:glowPulse 0.5s ease-out forwards;
  }

  .sparkle-burst .spark{
    position:absolute;
    top:0;
    left:0;
    width:18px;
    height:18px;
    margin:-9px 0 0 -9px;
    clip-path:polygon(50% 0%, 61% 35%, 100% 50%, 61% 65%, 50% 100%, 39% 65%, 0% 50%, 39% 35%);
    opacity:0;
    animation:sparkTwinkle 0.75s ease-out forwards;
    animation-delay:var(--d, 0s);
  }

  @keyframes glowPulse{
    0%{ transform:scale(0.3); opacity:0; }
    35%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(2); opacity:0; }
  }

  @keyframes sparkTwinkle{
    0%{ transform:translate(0, 0) scale(0) rotate(0deg); opacity:0; }
    22%{ transform:translate(0, 0) scale(1) rotate(20deg); opacity:1; }
    100%{ transform:translate(var(--tx), var(--ty)) scale(0.15) rotate(150deg); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .sparkle-burst{ display:none; }
  }

  .logo-wrap{
    -webkit-tap-highlight-color:transparent;
  }
</style>
</head>
<body>
  <main class="page">
    <div class="logo-wrap">
      <img class="logo" src="logo.png" alt="Art of the Popsicle logo">
    </div>
    <h1 class="name">Art of the Popsicle</h1>
    <p class="tagline">Design &amp; Digital Craft</p>
    <div class="stripe" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="services">
      <span class="service">Product Strategy</span>
      <span class="dot" aria-hidden="true"></span>
      <span class="service">Systems &amp; Software</span>
      <span class="dot" aria-hidden="true"></span>
      <span class="service">Identity &amp; Interface</span>
    </div>
    <a class="contact" href="mailto:hello@artofthepopsicle.com">hello@artofthepopsicle.com</a>
  </main>

  <div class="drip" id="drip" aria-hidden="true"></div>

  <script>
    (function(){
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return;

      var drip = document.getElementById('drip');
      var logo = document.querySelector('.logo');
      if (!drip || !logo) return;

      // Position of the white dot inside logo.png, as a fraction of the
      // rendered image box (measured from the source file: center at
      // roughly 39.7% across, 61.3% down).
      var DOT_X_PCT = 0.3974;
      var DOT_Y_PCT = 0.6129;

      var targetX = 0, targetY = 0;
      var currentX = 0, currentY = 0;
      var radius = 100;
      var active = false;

      // Push-ahead-of-cursor tracking
      var dirX = 0, dirY = -1;      // last known movement direction (unit vector)
      var speed = 0;                 // smoothed speed, px/ms
      var lastMoveX = null, lastMoveY = null, lastMoveT = null;
      var BASE_LEAD = 12;             // minimum px the dot sits ahead of the cursor, even at rest
      var MAX_LEAD = 34;              // cap so it doesn't fly off at high speed
      var SPEED_TO_LEAD = 45;         // how strongly speed extends the lead distance

      // Alignment "easter egg"
      var lastSparkleAt = -Infinity;
      var SPARKLE_COOLDOWN = 1400;

      function logoCenter(){
        var r = logo.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }

      function logoDotTarget(){
        var r = logo.getBoundingClientRect();
        return { x: r.left + r.width * DOT_X_PCT, y: r.top + r.height * DOT_Y_PCT, size: r.width };
      }

      function spawnSparkles(x, y){
        var burst = document.createElement('div');
        burst.className = 'sparkle-burst';
        burst.style.transform = 'translate(' + x + 'px, ' + y + 'px)';

        var glow = document.createElement('div');
        glow.className = 'glow';
        burst.appendChild(glow);

        var colors = ['#F2495C', '#FFC72C', '#7CB518', '#FFFFFF', '#FFC72C'];
        var count = 7;
        for (var i = 0; i < count; i++){
          var angle = (Math.PI * 2 * i / count) + (Math.random() * 0.6 - 0.3);
          var dist = 40 + Math.random() * 32;
          var spark = document.createElement('div');
          spark.className = 'spark';
          spark.style.background = colors[i % colors.length];
          spark.style.setProperty('--tx', (Math.cos(angle) * dist).toFixed(1) + 'px');
          spark.style.setProperty('--ty', (Math.sin(angle) * dist).toFixed(1) + 'px');
          spark.style.setProperty('--d', (Math.random() * 0.08).toFixed(2) + 's');
          burst.appendChild(spark);
        }

        document.body.appendChild(burst);
        setTimeout(function(){ burst.remove(); }, 900);
      }

      function tryFireSparkle(x, y, threshold){
        var t = logoDotTarget();
        var ddx = x - t.x;
        var ddy = y - t.y;
        if (ddx * ddx + ddy * ddy < threshold * threshold) {
          var now = performance.now();
          if (now - lastSparkleAt > SPARKLE_COOLDOWN) {
            lastSparkleAt = now;
            spawnSparkles(t.x, t.y);
            return true;
          }
        }
        return false;
      }

      window.addEventListener('mousemove', function(e){
        var now = performance.now();
        var mx = e.clientX, my = e.clientY;

        if (lastMoveX !== null){
          var dt = Math.max(now - lastMoveT, 1);
          var moveDx = mx - lastMoveX;
          var moveDy = my - lastMoveY;
          var moveDist = Math.sqrt(moveDx * moveDx + moveDy * moveDy);
          var instSpeed = moveDist / dt;

          speed += (instSpeed - speed) * 0.3;

          if (moveDist > 0.5){
            var nx = moveDx / moveDist;
            var ny = moveDy / moveDist;
            dirX += (nx - dirX) * 0.25;
            dirY += (ny - dirY) * 0.25;
            var dl = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
            dirX /= dl;
            dirY /= dl;
          }
        }
        lastMoveX = mx; lastMoveY = my; lastMoveT = now;

        var c = logoCenter();
        var dx = mx - c.x;
        var dy = my - c.y;
        var dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < radius) {
          active = true;
          var lead = Math.min(MAX_LEAD, BASE_LEAD + speed * SPEED_TO_LEAD);
          targetX = mx + dirX * lead;
          targetY = my + dirY * lead;
          drip.style.opacity = String(1 - Math.pow(dist / radius, 2));
        } else {
          active = false;
          drip.style.opacity = '0';
        }
      });

      // Touch / tap fallback: there's no cursor to trail on touch devices,
      // so the easter egg becomes "find and tap the white dot" instead.
      // The tap zone is sized generously (bigger than a mouse would need)
      // since fingers are far less precise than a pointer.
      logo.addEventListener('click', function(e){
        var t = logoDotTarget();
        var tapThreshold = Math.max(20, t.size * 0.4);
        tryFireSparkle(e.clientX, e.clientY, tapThreshold);
      });

      function tick(){
        currentX += (targetX - currentX) * 0.18;
        currentY += (targetY - currentY) * 0.18;
        drip.style.transform = 'translate(' + currentX + 'px, ' + currentY + 'px) translate(-50%, -50%)';

        if (active) {
          var t = logoDotTarget();
          var hoverThreshold = Math.max(4, t.size * 0.09);
          tryFireSparkle(currentX, currentY, hoverThreshold);
        }

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
